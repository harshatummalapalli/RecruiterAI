# Role Families — recruiter knowledge, not detection logic.
#
# Each entry describes what's generally true about a role family:
# responsibilities, the technology families it typically draws from, common
# career transitions, and related families. `detection_hints` is the one
# section aimed at helping automated matching find a candidate family at
# all — plain keyword/phrase lists, not regular expressions, so this stays
# engine-agnostic.
#
# `ts_role_family` cross-references the exact string used today by the
# `RoleFamily` union in frontend/src/intelligence/knowledge/roleFamilies.ts.

role_families:
  - id: backend-engineering
    label: Backend Engineering
    ts_role_family: Backend Engineer
    common_responsibilities:
      - API design
      - service architecture
      - database design
      - system reliability
      - performance and scalability
    common_technology_families: [programming-languages, databases, cloud, containers, messaging]
    common_career_transitions:
      - Senior Backend Engineer
      - Staff Engineer
      - Platform Engineer
      - Engineering Manager
    related_role_families: [full-stack-engineering, platform-engineering, data-engineering]
    detection_hints:
      title_phrases: [backend engineer, back-end engineer, server-side engineer]
      technology_phrases: [api, microservices, database, server-side]

  - id: frontend-engineering
