<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>RecruiterAI — AI Recruiting Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,420;9..144,500&display=swap"
    />
    <script>
      // Applied before any stylesheet paints, so the first frame already matches the stored preference —
      // ThemeProvider (src/theme/ThemeProvider.tsx) is the source of truth after React mounts; this just
      // avoids a flash of the wrong theme on load. No preference stored, or it's "system": do nothing,
      // and the prefers-color-scheme media query in tokens.css decides.
      (function () {
        try {
          var stored = localStorage.getItem('recruiterai:theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {
          // Best-effort only.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
